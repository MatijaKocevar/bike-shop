services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: bike_shop
        ports:
            - "5433:5432"
        volumes:
            - db_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres -d bike_shop"]
            interval: 5s
            timeout: 5s
            retries: 5

    minio:
        image: minio/minio:latest
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:10001,http://127.0.0.1:10001"
        ports:
            - "9002:9000"
            - "9003:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 5s
            timeout: 5s
            retries: 5

    createbuckets:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin &&
            mc mb --ignore-existing local/bike-shop-files &&
            mc anonymous set download local/bike-shop-files &&
            exit 0"

volumes:
    db_data:
    minio_data:
